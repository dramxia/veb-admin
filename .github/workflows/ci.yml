name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '20.10.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  migrations:
    runs-on: ubuntu-latest
    services:
      veb-postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: veb_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d veb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      blog-postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: blog_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d blog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '20.10.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @veb/veb-api prisma:generate
      - run: pnpm --filter @veb/veb-api prisma:migrate:deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/veb_test?schema=public
      - run: pnpm --filter @veb/veb-api exec prisma migrate status
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/veb_test?schema=public
      - run: pnpm --filter @veb/blog-api prisma:generate
      - run: pnpm --filter @veb/blog-api prisma:migrate:deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/blog_test?schema=public
      - run: pnpm --filter @veb/blog-api exec prisma migrate status
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/blog_test?schema=public

  integration-e2e:
    runs-on: ubuntu-latest
    services:
      veb-postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: veb_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d veb_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      blog-postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: blog_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d blog_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '20.10.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @veb/web exec playwright install --with-deps chromium
      - run: pnpm db:generate
      - name: Migrate both databases
        run: |
          DATABASE_URL="$VEB_DATABASE_URL" pnpm --filter @veb/veb-api prisma:migrate:deploy
          DATABASE_URL="$BLOG_DATABASE_URL" pnpm --filter @veb/blog-api prisma:migrate:deploy
        env:
          VEB_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/veb_e2e?schema=public
          BLOG_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/blog_e2e?schema=public
      - name: Seed VEB database
        run: pnpm --filter @veb/veb-api db:seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/veb_e2e?schema=public
          SEED_ADMIN_PASSWORD: Admin@123-ci
      - name: Run cross-service integration and E2E tests
        shell: bash
        env:
          VEB_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/veb_e2e?schema=public
          BLOG_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/blog_e2e?schema=public
          E2E_ADMIN_PASSWORD: Admin@123-ci
        run: |
          set -euo pipefail

          mkdir -p .artifacts/ci
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/service-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/service-private.pem -pubout -out /tmp/service-public.pem

          VEB_PID=""
          BLOG_PID=""
          WEB_PID=""
          cleanup() {
            for pid in "$WEB_PID" "$BLOG_PID" "$VEB_PID"; do
              if [ -n "$pid" ]; then
                kill "$pid" 2>/dev/null || true
              fi
            done
          }
          trap cleanup EXIT

          (
            cd apps/veb-api
            exec env \
              DATABASE_URL="$VEB_DATABASE_URL" \
              AUTH_SECRET="ci-auth-secret-at-least-32-characters" \
              AUTH_URL="http://127.0.0.1:1066" \
              AUTH_TRUST_HOST="true" \
              BLOG_API_INTERNAL_URL="http://127.0.0.1:1068" \
              SERVICE_AUTH_PRIVATE_KEY="$(cat /tmp/service-private.pem)" \
              SERVICE_AUTH_PUBLIC_KEY="$(cat /tmp/service-public.pem)" \
              SERVICE_AUTH_KEY_ID="ci-key-1" \
              SERVICE_AUTH_ISSUER="veb-api" \
              ./node_modules/.bin/next dev -p 1067
          ) >.artifacts/ci/veb-api.log 2>&1 &
          VEB_PID=$!

          (
            cd apps/blog-api
            exec env \
              DATABASE_URL="$BLOG_DATABASE_URL" \
              BLOG_VISITOR_HASH_SECRET="ci-blog-visitor-secret" \
              SERVICE_AUTH_JWKS_URL="http://127.0.0.1:1067/api/internal/.well-known/jwks.json" \
              SERVICE_AUTH_ISSUER="veb-api" \
              ./node_modules/.bin/next dev -p 1068
          ) >.artifacts/ci/blog-api.log 2>&1 &
          BLOG_PID=$!

          (
            cd apps/web
            exec env \
              VEB_API_INTERNAL_URL="http://127.0.0.1:1067" \
              BLOG_API_INTERNAL_URL="http://127.0.0.1:1068" \
              ./node_modules/.bin/next dev -p 1066
          ) >.artifacts/ci/web.log 2>&1 &
          WEB_PID=$!

          wait_for_url() {
            local name="$1"
            local url="$2"
            local log="$3"
            for _ in $(seq 1 60); do
              if curl --fail --silent --show-error "$url" >/dev/null; then
                return 0
              fi
              sleep 2
            done
            echo "$name did not become ready"
            tail -n 200 "$log"
            return 1
          }

          wait_for_url "VEB API" "http://127.0.0.1:1067/api/health/ready" ".artifacts/ci/veb-api.log"
          wait_for_url "Blog API" "http://127.0.0.1:1068/api/health/ready" ".artifacts/ci/blog-api.log"
          wait_for_url "Web" "http://127.0.0.1:1066/login" ".artifacts/ci/web.log"

          E2E_KEEP_ARTICLE=1 E2E_SKIP_WEB_SERVER=1 pnpm test:e2e

          kill "$VEB_PID"
          wait "$VEB_PID" || true
          VEB_PID=""
          if curl --fail --silent "http://127.0.0.1:1067/api/health/ready" >/dev/null; then
            echo "VEB API is still running; failure-isolation check is invalid"
            exit 1
          fi
          E2E_SERVICE_ISOLATION=1 E2E_SKIP_WEB_SERVER=1 \
            pnpm --filter @veb/web exec playwright test service-isolation.spec.ts
      - name: Upload integration diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-e2e-diagnostics
          if-no-files-found: ignore
          path: |
            .artifacts/ci
            apps/web/playwright-report
            apps/web/test-results

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, veb-api, blog-api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          target: runner
          push: false
