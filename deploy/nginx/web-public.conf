map $http_x_request_id $web_request_id {
  default $http_x_request_id;
  ""      $request_id;
}

map $http_upgrade $web_connection_upgrade {
  default upgrade;
  ""      close;
}

log_format web_public_json escape=json
  '{"time":"$time_iso8601","requestId":"$web_request_id",'
  '"remoteAddr":"$remote_addr","method":"$request_method",'
  '"path":"$uri","status":$status,"duration":$request_time}';

upstream web_app {
  server web:1066;
  keepalive 16;
}

server {
  listen 1066;
  server_name _;
  server_tokens off;

  access_log /var/log/nginx/access.log web_public_json;
  add_header X-Request-Id $web_request_id always;

  location / {
    proxy_pass http://web_app;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $web_connection_upgrade;
    proxy_set_header X-Request-Id $web_request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Request-Id;
  }
}
