map $http_x_request_id $blog_request_id {
  default $http_x_request_id;
  ""      $request_id;
}

log_format blog_public_json escape=json
  '{"time":"$time_iso8601","requestId":"$blog_request_id",'
  '"remoteAddr":"$remote_addr","method":"$request_method",'
  '"path":"$uri","status":$status,"duration":$request_time}';

upstream blog_api {
  server blog-api:1068;
  keepalive 16;
}

server {
  listen 1068;
  server_name _;
  server_tokens off;
  default_type application/json;
  access_log /var/log/nginx/access.log blog_public_json;

  add_header X-Request-Id $blog_request_id always;

  location ~ ^/api/v1/public(?:/|$) {
    proxy_pass http://blog_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $blog_request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Request-Id;
  }

  location ~ ^/api/health/(?:live|ready)$ {
    proxy_pass http://blog_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $blog_request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Request-Id;
  }

  location / {
    return 404 '{"code":40401,"data":null,"message":"Not found"}';
  }
}
