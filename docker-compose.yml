x-prisma-migrate: &prisma-migrate
  build:
    context: .
    dockerfile: deploy/migrate/Dockerfile
    target: runner

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-veb}
      POSTGRES_USER: ${DB_USER:-veb}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-veb} -d ${DB_NAME:-veb}']
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *prisma-migrate
    command:
      [
        'migrate',
        'deploy',
        '--schema',
        '/app/apps/core-api/prisma/schema.prisma',
      ]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    restart: 'no'

  seed:
    build:
      context: .
      dockerfile: apps/core-api/Dockerfile
      target: seed
    profiles: ['operations']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD is required}
    restart: 'no'

  core-api:
    build:
      context: .
      dockerfile: apps/core-api/Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      AUTH_URL: ${PUBLIC_APP_URL:-http://localhost:1068}
      AUTH_TRUST_HOST: 'true'
      BLOG_VISITOR_HASH_SECRET: ${BLOG_VISITOR_HASH_SECRET:?BLOG_VISITOR_HASH_SECRET is required}
      UPLOAD_DIR: /app/uploads
      STORAGE_KIND: local
      HOSTNAME: '0.0.0.0'
    expose: ['1067']
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:1067/api/health/ready >/dev/null',
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      core-api:
        condition: service_healthy
    environment:
      CORE_API_INTERNAL_URL: ${CORE_API_INTERNAL_URL:-http://core-api:1067}
      WEB_TRUST_PROXY_HEADERS: 'true'
    expose: ['1066']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:1066/api/health/ready >/dev/null',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web-public:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - '${WEB_PUBLIC_PORT:-1068}:1066'
    volumes:
      - ./deploy/nginx/web-public.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:1066/api/health/ready >/dev/null',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres-data:
  uploads:
